<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Финансы</title>

<style>
:root{
  --bg:#f5f5f2;
  --card:#fbfbf8;
  --border:#e3e3de;
  --text-main:#141414;
  --text-muted:#6b6b6b;
  --green:#2f8f5f;
  --red:#a14a4a;
}
*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  font-family:Helvetica,Arial,sans-serif;
  display:flex;
  justify-content:center;
  color:var(--text-main);
}

.page{
  width:100%;
  max-width:420px;
  padding:16px;
  padding-bottom:180px;
  display:flex;
  flex-direction:column;
  gap:24px;
}

.section{
  background:var(--card);
  border:1px solid var(--border);
  padding:16px;
}

.title{
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--text-muted);
  margin-bottom:10px;
}
.title span{
  cursor:pointer;
  text-decoration:underline;
}

/* GRAPH */
svg{width:100%;height:180px}

/* INTERPRETATION */
.interpretation{
  margin-top:12px;
  font-size:13px;
  line-height:1.4;
}
.quote{font-style:italic}
.author{
  font-size:11px;
  color:var(--text-muted);
  margin-bottom:6px;
}

/* STATS */
.stat-main{
  font-size:22px;
  font-weight:bold;
}
.stat-caption{
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--text-muted);
  margin-top:6px;
}
.stat-sub{
  font-size:12px;
  margin-top:4px;
}
.stats{
  display:flex;
  justify-content:space-between;
  margin-top:12px;
}
.stat-value{font-size:16px}
.stat-label{
  font-size:10px;
  color:var(--text-muted);
  margin-top:4px;
}
.positive{color:var(--green)}
.negative{color:var(--red)}

/* FORM */
.form{
  display:flex;
  flex-direction:column;
  gap:12px;
}
input,select,button{
  padding:12px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text-main);
}
button{cursor:pointer}

/* remove number arrows */
input[type=number]{
  -moz-appearance:textfield;
}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{
  -webkit-appearance:none;
  margin:0;
}

/* FLOW */
.flow-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
}
.flow-toggle{
  font-size:14px;
  color:var(--text-muted);
}
.flow-list{margin-top:8px}

.flow-day{margin-top:14px}
.flow-date{
  font-size:11px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--text-muted);
  margin-bottom:6px;
}
.flow-item{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  font-size:14px;
}
.flow-total{
  font-weight:bold;
  margin-top:4px;
}

/* DATE PICKER */
.date-picker{
  display:none;
  margin-top:8px;
}

/* LIMITS */
.limits-btn{
  width:100%;
  padding:10px;
  margin-top:12px;
  background:none;
  border:1px dashed var(--border);
  border-radius:10px;
  font-size:13px;
  color:var(--text-muted);
  cursor:pointer;
}
.limits-list{
  margin-top:12px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.limit-chip{
  display:flex;
  justify-content:space-between;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--bg);
  font-size:14px;
}
.limit-chip .muted{ color:var(--text-muted); font-size:12px; }

/* MODAL */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.25);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:100;
}
.modal-card{
  width:94%;
  max-width:420px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  box-shadow:0 20px 60px rgba(0,0,0,0.25);
  overflow:hidden;
}
.modal-title{
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--text-muted);
  margin-bottom:14px;
}
.add-row{
  width:100%;
  padding:8px;
  background:none;
  border:1px dashed var(--border);
  border-radius:8px;
  font-size:13px;
  color:var(--text-muted);
  cursor:pointer;
  margin-bottom:14px;
}
.add-row.danger{
  color: var(--text-muted);
  border-style: solid;
}
.modal-actions{
  display:flex;
  gap:10px;
}
.modal-actions button{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--border);
  background:none;
  cursor:pointer;
}
.modal-actions .primary{
  border-color:var(--text-main);
  color:var(--text-main);
}
.modal-actions .secondary{
  color:var(--text-muted);
}
.limit-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
}
.limit-row input[type="checkbox"]{ flex:0 0 16px; }
.limit-row input[type="text"]{ flex:2; }
.limit-row input[type="number"]{ flex:1; }
.limit-check{
  width:16px;
  height:16px;
  accent-color: var(--text-main);
  cursor:pointer;
}
</style>
</head>

<body>
<main class="page">

<!-- ПРОГРЕСС -->
<section class="section">
  <div class="title">
    Прогресс капитала · <span onclick="toggleDate()">месяц</span>
  </div>
  <div class="date-picker" id="datePicker">
    <input type="date" id="selectedDate">
  </div>

  <svg id="chart"></svg>

  <div class="interpretation" id="interpretation"></div>
</section>

<!-- ОБЩИЙ КАПИТАЛ -->
<section class="section">
  <div class="title">Цель</div>

  <!-- сюда подставим реальный капитал -->
  <div class="stat-main positive" id="capitalMain">—</div>
  <div class="stat-caption">Общий капитал</div>
  <div class="stat-sub" id="capitalSub"> </div>

  <!-- Пока оставляем как визуальные карточки; позже подключим расчёт по видам -->
  <div class="stats">
    <div>
      <div class="stat-value" id="savedBox">—</div>
      <div class="stat-label" id="saveSum">Сэкономлено</div>
    </div>
    <div>
      <div class="stat-value" id="saved2Box">—</div>
      <div class="stat-label">Отложено</div>
    </div>
    <div>
      <div class="stat-value" id="investedBox">—</div>
      <div class="stat-label">Инвестировано</div>
    </div>
  </div>
</section>

<!-- ДЕЙСТВИЕ -->
<section class="section">
  <div class="title">Зафиксировать действие</div>
  <form class="form" id="actionForm">
    <!-- ВАЖНО: value = kind для backend -->
    <select id="kind">
      <option value="save">Сэкономил</option>
      <option value="save">Отложил</option>
      <option value="invest">Инвестировал</option>
      <option value="expense">Расходовал</option>
    </select>

    <input id="amount" type="number" placeholder="Сумма (₽)" required>
    <button type="submit" id="submitBtn">Подтвердить</button>
  </form>
</section>

<!-- ===== ЛИМИТЫ НА МЕСЯЦ ===== -->
<section class="section">
  <div class="title" id="limitsTitle">Лимиты · месяц</div>

  <button class="limits-btn" onclick="openLimitsModal()">
    Управление лимитами
  </button>

  <!-- вывод лимитов под кнопкой -->
  <div class="limits-list" id="limitsList"></div>
</section>

<!-- ПОТОК -->
<section class="section">
  <div class="flow-header" onclick="toggleFlow()">
    <div class="title" style="margin:0" id="flowTitle">Поток капитала · 7 дней</div>
    <div class="flow-toggle" id="flowToggle">▾</div>
  </div>

  <div class="flow-list" id="flowList"></div>

  <!-- LIMITS MODAL -->
  <div class="modal-overlay" id="limitsModal">
    <div class="modal-card">
      <div class="modal-title">Лимиты · месяц</div>

      <div id="limitsRows">
        <div class="limit-row">
          <input type="checkbox" class="limit-check">
          <input class="limit-category" placeholder="Категория">
          <input class="limit-value" type="number" placeholder="Лимит ₽">
        </div>
      </div>

      <button class="add-row" onclick="addLimitRow()">+ Добавить категорию</button>
      <button class="add-row danger" onclick="removeSelectedLimits()">Удалить выбранные</button>

      <div class="modal-actions">
        <button type="button" class="secondary" onclick="closeLimitsModal()">Закрыть</button>
        <button type="button" class="primary" onclick="saveLimits()">Сохранить</button>
      </div>
    </div>
  </div>
</section>

</main>

<script>
/* ======================= utils ======================= */

#вывод сэкономленной суммы за период - (сделать редактируемые данные)
async function loadSaved() {
  const data = await getJSON(
    "/api/finance/flow?start=2025-01-01&end=2026-12-31"
  );

  // все события
  const events = data.flatMap(d => d.events);

  // сумма только save
  const savedTotal = events
    .filter(e => e.kind === "save")
    .reduce((sum, e) => sum + e.amount, 0);

  // вставляем в savedBox
  const el = document.getElementById("savedBox");
  el.textContent = savedTotal;
}

loadSaved();



const fmtMoney = (n) => {
  const sign = n > 0 ? "+" : "";
  return sign + Number(n).toLocaleString("ru-RU") + " ₽";
};
const iso = (d) => d.toISOString().slice(0,10);
const daysAgo = (n) => new Date(Date.now() - n*86400000);

async function getJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function postJSON(url, body){
  const r = await fetch(url, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(body)
  });
  if(!r.ok) throw new Error(await r.text());
  return r.json();

}

/* ======================= UI toggles ======================= */
function toggleDate(){
  const d = document.getElementById("datePicker");
  d.style.display = d.style.display === "block" ? "none" : "block";
}

let flowOpen = true;
function toggleFlow(){
  const list = document.getElementById("flowList");
  const icon = document.getElementById("flowToggle");
  flowOpen = !flowOpen;
  list.style.display = flowOpen ? "block" : "none";
  icon.innerText = flowOpen ? "▾" : "▸";
}

/* ======================= FINANCE: capital ======================= */
async function loadCapital(){
  const data = await getJSON("/api/finance/capital"); // { total }
  const total = Number(data.total || 0);
  const el = document.getElementById("capitalMain");

  el.textContent = total.toLocaleString("ru-RU") + " ₽";
  el.className = "stat-main " + (total >= 0 ? "positive" : "negative");

  // пока простая подпись (позже сделаем "к дате" и цель)
  document.getElementById("capitalSub").textContent = total >= 0
    ? "Капитал растёт"
    : "Капитал снижается";
}

/* ======================= FINANCE: flow (7 days) ======================= */
async function loadFlow(){
  const from = iso(daysAgo(7));
  const to = iso(new Date());

  // у тебя уже работает вариант start/end (ты писал что 200 OK)
  const days = await getJSON(`/api/finance/flow?start=${from}&end=${to}`);

  const box = document.getElementById("flowList");
  box.innerHTML = "";

  days.forEach(d=>{
    const dayWrap = document.createElement("div");
    dayWrap.className = "flow-day";
    dayWrap.innerHTML = `<div class="flow-date">${d.day}</div>`;

    (d.events || []).forEach(e=>{
      dayWrap.innerHTML += `
        <div class="flow-item">
          <span>${e.kind}</span>
          <span class="${Number(e.amount) >= 0 ? "positive" : "negative"}">
            ${fmtMoney(e.amount)}
          </span>
        </div>
      `;
    });

    dayWrap.innerHTML += `
      <div class="flow-total ${Number(d.net) >= 0 ? "positive" : "negative"}">
        Итог дня: ${fmtMoney(d.net)}
      </div>
    `;

    box.appendChild(dayWrap);
  });
}

/* ======================= FINANCE: candles (30 days) ======================= */
function drawCandlesFromDailyNet(daily){
  const svg = document.getElementById("chart");
  svg.innerHTML = "";

  const w = svg.clientWidth || 360;
  const h = svg.clientHeight || 180;
  const p = 10;

  // Превратим "net per day" в "price series"
  // base = 10000, close = base + net
  let base = 10000;
  const candles = daily.map(net=>{
    const o = base;
    const c = base + Number(net || 0);
    const hi = Math.max(o,c);
    const lo = Math.min(o,c);
    base = c;
    return [o, hi, lo, c];
  });

  const vals = candles.flat();
  const max = Math.max(...vals);
  const min = Math.min(...vals);
  const sy = v => (h - p) - ((v - min) / (max - min || 1)) * (h - p*2);

  const step = w / candles.length;
  const cw = step * 0.6;

  candles.forEach((c,i)=>{
    const [o,hi,lo,cl] = c;
    const x = i*step + step/2 - cw/2;
    const color = cl >= o ? "var(--green)" : "var(--red)";

    const wick = document.createElementNS("http://www.w3.org/2000/svg","line");
    wick.setAttribute("x1", x + cw/2);
    wick.setAttribute("x2", x + cw/2);
    wick.setAttribute("y1", sy(hi));
    wick.setAttribute("y2", sy(lo));
    wick.setAttribute("stroke", color);
    svg.appendChild(wick);

    const body = document.createElementNS("http://www.w3.org/2000/svg","rect");
    body.setAttribute("x", x);
    body.setAttribute("width", cw);
    body.setAttribute("y", sy(Math.max(o,cl)));
    body.setAttribute("height", Math.max(2, Math.abs(sy(o) - sy(cl))));
    body.setAttribute("fill", color);
    svg.appendChild(body);
  });
}

async function loadChart(){
  const from = iso(daysAgo(30));
  const to = iso(new Date());
  const days = await getJSON(`/api/finance/flow?start=${from}&end=${to}`);

  // days = [{day, net, events}]
  // Нужно по времени слева направо: старые → новые
  const ordered = [...days].reverse();
  const dailyNet = ordered.map(d => Number(d.net || 0));

  drawCandlesFromDailyNet(dailyNet);
}

/* ======================= INTERPRETATION (временно) ======================= */
function setInterpretationStub(){
  document.getElementById("interpretation").innerHTML = `
    <div class="quote">Быстро — это медленно, но постоянно</div>
    <div class="author">— Сенека</div>
  `;
}

/* ======================= ACTION FORM: реально пишем в API ======================= */
const form = document.getElementById("actionForm");
const btn = document.getElementById("submitBtn");

form.addEventListener("submit", async (e)=>{
  e.preventDefault();

  const kind = document.getElementById("kind").value;
  const amount = Number(document.getElementById("amount").value);

  if(!amount || amount <= 0){
    alert("Введите сумму");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Сохраняем…";

  try{
    await postJSON("/api/finance/events", {
      kind,
      amount,
      category_id: null,
      date: null
    });

    form.reset();

    // Обновляем данные на странице
    await Promise.all([loadCapital(), loadFlow(), loadChart(), loadSaved()]);
    btn.innerText = "Зафиксировано";
  }catch(err){
    console.error(err);
    btn.innerText = "Ошибка";
    alert("Не удалось сохранить действие. Проверь сервер/логи.");
  }

  setTimeout(()=>{
    btn.innerText = "Подтвердить";
    btn.disabled = false;
  }, 800);
});

/* ======================= LIMITS MODAL ======================= */
function openLimitsModal(){
  document.getElementById("limitsModal").style.display = "flex";
}
function closeLimitsModal(){
  document.getElementById("limitsModal").style.display = "none";
}

function addLimitRow(){
  const row = document.createElement("div");
  row.className = "limit-row";
  row.innerHTML = `
    <input type="checkbox" class="limit-check">
    <input class="limit-category" placeholder="Категория">
    <input class="limit-value" type="number" placeholder="Лимит ₽">
  `;
  document.getElementById("limitsRows").appendChild(row);
}

function removeSelectedLimits(){
  const rows = document.querySelectorAll("#limitsRows .limit-row");
  rows.forEach(r=>{
    const cb = r.querySelector(".limit-check");
    if(cb && cb.checked) r.remove();
  });
}

/* ===== ЛИМИТЫ: загрузка/вывод под кнопкой =====
   Сейчас backend limits не использует auth и требует user_id в фильтрах/вставке.
   Поэтому временно user_id = 1 (как у тебя было).
   Далее сделаем нормально: backend сам определяет текущего юзера и фронт не передает user_id.
*/
const TEMP_USER_ID = 1;

function monthYearNow(){
  const d = new Date();
  return { month: d.getMonth()+1, year: d.getFullYear() };
}

async function loadLimits(){
  const {month, year} = monthYearNow();

  // безопасно было бы не давать выбирать user_id на фронте, но пока так
  const limits = await getJSON(`/api/user/data?user_id=${TEMP_USER_ID}&month=${month}&year=${year}`);

  // заголовок
  const months = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
  document.getElementById("limitsTitle").textContent = `Лимиты · ${months[month-1]}`;

  // список под кнопкой
  const list = document.getElementById("limitsList");
  list.innerHTML = "";

  if(!limits.length){
    list.innerHTML = `<div class="limit-chip"><span class="muted">Лимитов пока нет</span><span class="muted">—</span></div>`;
    return;
  }

  limits.forEach(l=>{
    const item = document.createElement("div");
    item.className = "limit-chip";
    item.innerHTML = `
      <span>${l.category}</span>
      <span>${Number(l.monthly_limit).toLocaleString("ru-RU")} ₽</span>
    `;
    list.appendChild(item);
  });

  // также заполним модалку (для удобства редактирования)
  const rowsBox = document.getElementById("limitsRows");
  rowsBox.innerHTML = "";
  limits.forEach(l=>{
    const row = document.createElement("div");
    row.className = "limit-row";
    row.innerHTML = `
      <input type="checkbox" class="limit-check">
      <input class="limit-category" value="${l.category}">
      <input class="limit-value" type="number" value="${l.monthly_limit}">
    `;
    rowsBox.appendChild(row);
  });

  if(!limits.length){
    addLimitRow();
  }
}

async function saveLimits(){
  const {month, year} = monthYearNow();
  const rows = document.querySelectorAll("#limitsRows .limit-row");

  // сохраняем построчно (позже сделаем batch эндпоинт, но пока ок)
  for(const row of rows){
    const category = row.querySelector(".limit-category")?.value?.trim();
    const value = Number(row.querySelector(".limit-value")?.value);

    if(!category || !value || value<=0) continue;

    await postJSON("/api/limits", {
      user_id: TEMP_USER_ID,      // временно
      category: category,
      monthly_limit: value,
      month: month,
      year: year
    });
  }

  closeLimitsModal();
  await loadLimits();
}

/* ======================= INIT ======================= */
(async ()=>{
  setInterpretationStub();
  await Promise.all([loadCapital(), loadFlow(), loadChart(), loadSaved()]);
  await loadLimits();
})();
</script>

</body>
</html>
